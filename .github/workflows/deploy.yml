name: Deploy site to GitHub Pages

# main only. A push to any other branch used to start a deploy that failed two
# seconds in, with no logs and no steps run: the `github-pages` environment only
# accepts deployments from the default branch, and that policy lives in the
# repository settings, not here. Triggering a run that cannot succeed just fills
# the Actions tab with red. Work on a branch, merge to main, deploy.
on:
  push:
    branches:
      - main
  workflow_dispatch:

# Allow GITHUB_TOKEN to deploy to Pages.
permissions:
  contents: read
  pages: write
  id-token: write

# One deploy at a time; don't cancel a run that is already publishing.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      # site/ is committed pre-built so the repo is deployable on its own,
      # but the runner rebuilds it so a stale commit can never ship.
      - name: Build
        run: |
          if [ -f build.py ]; then
            python3 build.py
          else
            echo "No build.py — publishing the committed site/ as-is."
          fi

      # Pages must be switched on by a human, once, before this can run:
      # Settings -> Pages -> Build and deployment -> Source -> GitHub Actions.
      # `enablement: true` was tried and cannot work — creating a Pages site
      # needs administration: write, which GITHUB_TOKEN never carries, so the
      # action fails with "Create Pages site failed. Error: Resource not
      # accessible by integration". Until Pages is on, this step 404s.
      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

      - id: deployment
        uses: actions/deploy-pages@v4
