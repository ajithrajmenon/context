name: Deploy site to GitHub Pages

on:
  push:
    branches:
      - main
      - claude/explainer-preview-deploy-c8bek4
  workflow_dispatch:

# Allow GITHUB_TOKEN to deploy to Pages.
permissions:
  contents: read
  pages: write
  id-token: write

# One deploy at a time; don't cancel a run that is already publishing.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      # The site is committed pre-built. If build.py and plates_data.py are
      # added to the repo later, this regenerates site/ before publishing.
      - name: Build
        run: |
          if [ -f build.py ]; then
            python3 build.py
          else
            echo "No build.py — publishing the committed site/ as-is."
          fi

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

      - id: deployment
        uses: actions/deploy-pages@v4
