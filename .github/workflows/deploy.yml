name: Deploy site to GitHub Pages

on:
  push:
    branches:
      - main
      - claude/explainer-preview-deploy-c8bek4
  workflow_dispatch:

# Allow GITHUB_TOKEN to deploy to Pages.
permissions:
  contents: read
  pages: write
  id-token: write

# One deploy at a time; don't cancel a run that is already publishing.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      # site/ is committed pre-built so the repo is deployable on its own,
      # but the runner rebuilds it so a stale commit can never ship.
      - name: Build
        run: |
          if [ -f build.py ]; then
            python3 build.py
          else
            echo "No build.py — publishing the committed site/ as-is."
          fi

      # enablement turns Pages on via the API if it is off, which is the whole
      # of the first-run failure: the action queries the Pages site, gets a 404
      # and stops. With this, a fresh repository deploys without anyone opening
      # the settings page.
      - uses: actions/configure-pages@v5
        with:
          enablement: true

      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

      - id: deployment
        uses: actions/deploy-pages@v4
