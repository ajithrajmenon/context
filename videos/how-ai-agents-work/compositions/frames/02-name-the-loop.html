  <script>
    window.__timelines = window.__timelines || {};
    const tl = gsap.timeline({ paused: true });

    // ---------------------------------------------------------------------
    // Scene 1 (0.0–0.9s) — lead-in settles small, upper-center; a thin
    // cobalt accent-line draws beneath it as a quiet punctuation beat.
    // spring-pop-entrance mechanics (fromTo, scale+opacity, power3.out, no
    // overshoot) at reduced amplitude — "fades/scales in small".
    // ---------------------------------------------------------------------
    tl.fromTo(
      "#ntl-leadin",
      { opacity: 0, scale: 0.92 },
      { opacity: 1, scale: 1, duration: 0.55, ease: "power3.out" },
      0.05,
    );
    tl.fromTo("#ntl-accent-fill", { scaleX: 0 }, { scaleX: 1, duration: 0.35, ease: "power3.out" }, 0.35);

    // ---------------------------------------------------------------------
    // Scene 2 (0.9–3.0s) — the four role-words pop in one at a time,
    // left-to-right, matched to the VO naming cadence. dynamic-content-
    // sequencing utility: the beat grid is computed once as a flat array
    // (not scattered magic numbers), then each entry is realized with the
    // spring-pop-entrance recipe — scale 0→1 + opacity, power3.out, no
    // overshoot ("smooth register").
    // ---------------------------------------------------------------------
    const WORD_START_BASE = 0.9;
    const WORD_STAGGER = 0.5;
    const POP_DUR = 0.45;
    const WORD_TIMELINE = ["perceive", "reason", "act", "observe"].map((word, i) => ({
      word,
      start: WORD_START_BASE + i * WORD_STAGGER,
    }));

    WORD_TIMELINE.forEach((entry, i) => {
      tl.fromTo(
        "#ntl-unit-" + i,
        { opacity: 0, scale: 0, y: 14 },
        { opacity: 1, scale: 1, y: 0, duration: POP_DUR, ease: "power3.out" },
        entry.start,
      );
    });

    // ---------------------------------------------------------------------
    // Scene 3 (3.0–4.288s) — closing phrase fades up beneath the set; the
    // four words settle and hold as one labeled row, with a brief, low-
    // amplitude sine-wave-loop jitter (yoyo form, short window) so the
    // hold reads alive rather than frozen.
    // ---------------------------------------------------------------------
    tl.fromTo("#ntl-closing", { opacity: 0, y: 10 }, { opacity: 1, y: 0, duration: 0.5, ease: "power3.out" }, 3.05);

    tl.to("#ntl-word-row", { y: -2, duration: 0.3, ease: "sine.inOut", yoyo: true, repeat: 1 }, 3.6);

    window.__timelines["02-name-the-loop"] = tl;
