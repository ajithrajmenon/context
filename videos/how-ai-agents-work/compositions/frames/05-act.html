  <script>
    (function () {
      var root = document.querySelector('#root[data-composition-id="05-act"]');

      var eyebrow = root.querySelector("#act05-eyebrow");
      var steppill = root.querySelector("#act05-steppill");
      var headline = root.querySelector("#act05-headline");

      var nodePerceive = root.querySelector("#act05-node-perceive");
      var nodeReason = root.querySelector("#act05-node-reason");
      var arcPR = root.querySelector("#act05-arc-pr");
      var arcRA = root.querySelector("#act05-arc-ra");

      var actGhost = root.querySelector("#act05-act-ghost");
      var actFill = root.querySelector("#act05-act-fill");
      var actGlow = root.querySelector("#act05-act-glow");
      var actLabel = root.querySelector("#act05-act-label");

      var connSearch = root.querySelector("#act05-conn-search");
      var connCode = root.querySelector("#act05-conn-code");
      var connApi = root.querySelector("#act05-conn-api");

      var chipSearch = root.querySelector("#act05-chip-search");
      var chipCode = root.querySelector("#act05-chip-code");
      var chipApi = root.querySelector("#act05-chip-api");
      var chipGlowCode = root.querySelector("#act05-chip-glow-code");

      // Measure the two draw-on arcs (real geometry, not a guessed length).
      var lenPR = arcPR.getTotalLength();
      arcPR.style.strokeDasharray = lenPR;
      arcPR.style.strokeDashoffset = 0; // already fully drawn — carried forward from Frame 4

      var lenRA = arcRA.getTotalLength();
      arcRA.style.strokeDasharray = lenRA;
      arcRA.style.strokeDashoffset = lenRA;

      // Connector lines (Act node -> chips) self-draw as each chip fans out.
      [connSearch, connCode, connApi].forEach(function (p) {
        var len = p.getTotalLength();
        p.style.strokeDasharray = len;
        p.style.strokeDashoffset = len;
      });

      var tl = gsap.timeline({ paused: true });

      // ---- Setup (t=0): ring exactly as Frame 4 left it ----
      gsap.set(nodePerceive, { opacity: 0.65 });
      gsap.set(arcPR, { opacity: 0.65 });
      gsap.set(nodeReason, { opacity: 1 });
      gsap.set([actFill, actGlow], { opacity: 0, scale: 0.75 });
      gsap.set(actLabel, { opacity: 0, y: 6 });
      gsap.set([chipSearch, chipCode, chipApi], { opacity: 0, scale: 0.4 });
      gsap.set(chipGlowCode, { opacity: 0, scale: 0.85 });

      tl.fromTo(eyebrow, { opacity: 0 }, { opacity: 1, duration: 0.4, ease: "power1.out" }, 0.0);
      tl.fromTo(steppill, { opacity: 0 }, { opacity: 1, duration: 0.4, ease: "power1.out" }, 0.1);

      // Scene 1 (0.0-0.7s): Reason settles to ~65% opacity — a quick, smooth dim.
      tl.to(nodeReason, { opacity: 0.65, duration: 0.6, ease: "power1.out" }, 0.0);

      // Scene 2 (0.7-2.0s): "Next: act" — the arc self-draws from Reason to Act.
      tl.to(arcRA, { strokeDashoffset: 0, duration: 0.85, ease: "power2.out" }, 0.7);

      // Act node fills solid primary and glows once, landing as the arc completes.
      tl.to(actGhost, { opacity: 0, duration: 0.25, ease: "power1.out" }, 1.5);
      tl.fromTo(
        actGlow,
        { opacity: 0, scale: 0.85 },
        { opacity: 0.34, scale: 1, duration: 0.5, ease: "power2.out" },
        1.45
      );
      tl.to(actFill, { opacity: 1, scale: 1, duration: 0.4, ease: "back.out(1.4)" }, 1.55);
      tl.fromTo(actLabel, { opacity: 0, y: 6 }, { opacity: 1, y: 0, duration: 0.35, ease: "power2.out" }, 1.7);

      // Headline "Act" lands with the node.
      tl.fromTo(headline, { opacity: 0, y: 14 }, { opacity: 1, y: 0, duration: 0.5, ease: "power2.out" }, 1.6);

      // Scene 3 (2.0-4.117s): three tool chips fan out from the Act node,
      // staggered one per named tool (dynamic-content-sequencing timeline,
      // computed once — not hardcoded per-item offsets).
      var CHIP_ITEMS = [
        { conn: connSearch, chip: chipSearch, dx: 540 - 320, dy: 890 - 1080 },
        { conn: connCode, chip: chipCode, dx: 540 - 540, dy: 890 - 1150 },
        { conn: connApi, chip: chipApi, dx: 540 - 760, dy: 890 - 1080 },
      ];

      // Evenly computed cadence — one reveal per named tool, not hardcoded
      // per-item offsets: SCENE3_START + i * STEP.
      var SCENE3_START = 2.0;
      var STEP = 0.45;
      var CONN_DUR = 0.22;
      var CHIP_DUR = 0.3;

      CHIP_ITEMS.forEach(function (item, i) {
        var start = SCENE3_START + i * STEP;

        tl.to(item.conn, { strokeDashoffset: 0, duration: CONN_DUR, ease: "power2.out" }, start);

        tl.fromTo(
          item.chip,
          { opacity: 0, scale: 0.4, x: item.dx, y: item.dy },
          { opacity: 1, scale: 1, x: 0, y: 0, duration: CHIP_DUR, ease: "back.out(1.3)" },
          start + 0.03
        );
      });

      // As the line ends: "run code" is the one that's selected and fires —
      // scales up + glows while the other two settle dim (scale-swap-style
      // decisive pick, not a menu).
      var SELECT_START = 3.7;
      tl.fromTo(
        chipGlowCode,
        { opacity: 0, scale: 0.85 },
        { opacity: 0.4, scale: 1, duration: 0.4, ease: "power2.out" },
        SELECT_START - 0.1
      );
      tl.to(chipCode, { scale: 1.14, duration: 0.35, ease: "back.out(1.6)" }, SELECT_START);
      tl.to(
        chipCode,
        {
          backgroundColor: "rgba(30,43,250,0.15)",
          borderColor: "#1e2bfa",
          duration: 0.35,
          ease: "power2.out",
        },
        SELECT_START
      );
      tl.to(connCode, { opacity: 0.85, strokeWidth: 4, duration: 0.3, ease: "power2.out" }, SELECT_START);

      tl.to([chipSearch, chipApi], { opacity: 0.5, scale: 0.92, duration: 0.35, ease: "power2.out" }, SELECT_START);
      tl.to([connSearch, connApi], { opacity: 0.22, duration: 0.3, ease: "power2.out" }, SELECT_START);

      // Holds to 4.117s — the decisive pick reads, no further motion.

      window.__timelines = window.__timelines || {};
      window.__timelines["05-act"] = tl;
    })();
